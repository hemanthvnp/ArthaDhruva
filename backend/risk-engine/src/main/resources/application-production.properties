# Overrides for the 'production' profile (docker-compose.prod.yml sets it). Secrets are checked at
# start-up by RequiredSecretsEnvironmentPostProcessor; these are the behavioural differences.

# A production database is either empty (Flyway builds it from V1) or already under Flyway's control.
# A non-empty schema with no migration history is a misconfiguration -- a wrong database, a restore that
# lost the history table -- and adopting it as "baseline" would skip migrations against an unknown
# schema. Fail instead.
spring.flyway.baseline-on-migrate=false
# Never clean, whatever a future configuration says.
spring.flyway.clean-disabled=true
