spring.application.name=risk-engine

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:arthadhruva}${DB_JDBC_PARAMS:}
# Two DB identities (least privilege): the app runs as arthadhruva_app, a non-owner DML-only role
# that Postgres row-level security applies to (V11); Flyway migrates as the owner. The owner would
# bypass RLS, which is exactly why the app must never connect as it.
spring.datasource.username=${DB_APP_USER:arthadhruva_app}
spring.datasource.password=${DB_APP_PASSWORD:arthadhruva_app}
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${DB_USER:arthadhruva}
spring.flyway.password=${DB_PASSWORD:arthadhruva}
spring.flyway.placeholders.appDbPassword=${DB_APP_PASSWORD:arthadhruva_app}
# Flyway now owns schema evolution (db/migration/) -- validate only checks the entities still
# match what Flyway produced, it never alters anything itself. ddl-auto=update is retired: it's
# exactly the mechanism the README's manual-ALTER-TABLE history exists to work around (silently
# unable to widen a check constraint or add a NOT NULL column to a table that already has rows).
spring.jpa.hibernate.ddl-auto=validate
# Every table below was already created by ddl-auto=update before Flyway existed. baseline-on-migrate
# treats that pre-existing schema as the starting point (V1, an empty marker migration) instead of
# Flyway trying to re-CREATE tables that are already there -- avoids hand-transcribing a baseline
# script that would have to exactly match whatever Hibernate actually produced over time.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s

spring.datasource.hikari.connection-timeout=3000

resilience4j.circuitbreaker.instances.postgres.sliding-window-size=10
resilience4j.circuitbreaker.instances.postgres.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.postgres.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.redis.sliding-window-size=10
resilience4j.circuitbreaker.instances.redis.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.redis.wait-duration-in-open-state=10s
# A slower, flakier external dependency than Postgres/Redis (network hop to an LLM provider) --
# fewer samples before tripping and a longer cooldown, so a bad provider response doesn't get
# retried into a pile of slow requests.
resilience4j.circuitbreaker.instances.llm.sliding-window-size=5
resilience4j.circuitbreaker.instances.llm.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.llm.wait-duration-in-open-state=30s

resilience4j.retry.instances.postgres.max-attempts=2
resilience4j.retry.instances.postgres.wait-duration=100ms
resilience4j.retry.instances.redis.max-attempts=2
resilience4j.retry.instances.redis.wait-duration=50ms
resilience4j.retry.instances.llm.max-attempts=2
resilience4j.retry.instances.llm.wait-duration=500ms
# Exponential backoff with jitter: retries spread out instead of all landing at the same instant
# (synchronized retries against a struggling provider make the outage worse).
resilience4j.retry.instances.llm.enable-exponential-backoff=true
resilience4j.retry.instances.llm.exponential-backoff-multiplier=2
resilience4j.retry.instances.llm.enable-randomized-wait=true
resilience4j.retry.instances.llm.randomized-wait-factor=0.5

resilience4j.bulkhead.instances.postgres.max-concurrent-calls=20
resilience4j.bulkhead.instances.redis.max-concurrent-calls=20
resilience4j.bulkhead.instances.llm.max-concurrent-calls=10

spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USER:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:arthadhruva}

jwt.secret=${JWT_SECRET:}
# Short-lived access tokens, refreshed while the user is active, up to a hard limit from the moment
# of login. A stolen token is useful for minutes, not for a working day.
jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
jwt.session-max-hours=${JWT_SESSION_MAX_HOURS:8}
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:}

auth.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
auth.lockout-minutes=${AUTH_LOCKOUT_MINUTES:15}
auth.password-min-length=${AUTH_PASSWORD_MIN_LENGTH:10}

totp.encryption-key=${TOTP_ENCRYPTION_KEY:}
totp.setup-token-expiration-minutes=${TOTP_SETUP_EXPIRATION_MINUTES:10}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
activation.token-expiration-hours=${ACCOUNT_ACTIVATION_EXPIRATION_HOURS:72}

# LiteLLM proxy (see docker-compose.yml) -- an OpenAI-compatible REST API in front of whichever
# real provider litellm-config.yaml maps assistant-model to. Swapping providers is a LiteLLM
# config change, not a Java code change. No API key configured on the LiteLLM side means the
# assistant degrades to an "unavailable" response (see assistant.LlmClient) rather than the app
# failing to start -- same "missing secret -> graceful local behavior" pattern as everything else.
litellm.base-url=${LITELLM_BASE_URL:http://localhost:4000}
litellm.model=${LITELLM_MODEL:assistant-model}
litellm.api-key=${LITELLM_API_KEY:}

attachments.storage-dir=${ATTACHMENTS_STORAGE_DIR:./data/attachments}
attachments.max-size-bytes=${ATTACHMENTS_MAX_SIZE_BYTES:10485760}
# Total attachment bytes one organization may hold (default 1 GB).
attachments.tenant-quota-bytes=${ATTACHMENTS_TENANT_QUOTA_BYTES:1073741824}
# ClamAV daemon for scanning uploads. Empty = no scanner configured (uploads are still type-checked by
# content); when set, an upload is refused if the scanner cannot be reached.
attachments.av.host=${ATTACHMENTS_AV_HOST:}
attachments.av.port=${ATTACHMENTS_AV_PORT:3310}
# Spring's own multipart cap defaults to 1MB per file -- must be at least attachments.max-size-bytes
# above (10MB) or a within-policy upload would be rejected by the servlet layer before
# LoanAttachmentController ever sees it and can apply its own, more informative size check.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Streamed responses (CSV exports of any size) run as async requests; the container's default async
# timeout of 30 s would cut a large export off mid-file.
spring.mvc.async.request-timeout=5m

# Observability stack (docker-compose --profile observability): Prometheus scrapes
# /actuator/prometheus, traces export via OTLP to Jaeger, and structured JSON console logs
# (see logback-spring.xml) are picked up by Promtail into Loki. Everything here is additive --
# the app runs identically with the stack absent, just without anywhere for these to go.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
# SMTP being down must not take the app out of rotation (email is best-effort, sent async)
management.health.mail.enabled=false
management.metrics.tags.application=${spring.application.name}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
# Metrics already reach Prometheus via the /actuator/prometheus scrape above; spring-boot-starter-
# opentelemetry would otherwise ALSO push them over OTLP by default (to whatever's listening on
# :4318, Jaeger here, which has no metrics ingestion), which is redundant and just noisy.
management.otlp.metrics.export.enabled=false
# Tracing is opt-in: with no collector listening, every sampled request would only produce a failed
# export and an ERROR line. Set TRACE_SAMPLING=0.1 when the observability profile (Jaeger) is running;
# 1.0 traces everything while debugging, at a measurable CPU cost under load (see PERFORMANCE.md).
management.tracing.sampling.probability=${TRACE_SAMPLING:0}

# Open-session-in-view holds one Hibernate session (and its pooled connection) across the whole
# request, which would freeze the connection's app.tenant_id tag at whatever the tenant was when it
# was first used (login resolves the org BEFORE setting the tenant). Off: each transaction checks
# out its own connection, tagged with the tenant current at that moment. Also stops lazy loading
# from silently issuing queries from the view layer.
spring.jpa.open-in-view=false

# Cross-origin allow-list (comma-separated). Default: the Vite dev server. Empty in the
# containerised deployment, where nginx serves frontend and API from one origin.
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Behind nginx the socket peer is the proxy, not the client. Trust X-Forwarded-* (client IP,
# scheme) only when the peer is a private-range address (Tomcat's default internal-proxies
# pattern), i.e. the proxy on the docker network, never for a direct public connection.
server.forward-headers-strategy=native

# Webhooks: the delivery worker connects as its own restricted role (V15) so it can drain every
# tenant's outbox without the app role ever being granted cross-tenant access.
spring.flyway.placeholders.workerDbPassword=${DB_WORKER_PASSWORD:arthadhruva_worker}
webhook.worker.db-user=${DB_WORKER_USER:arthadhruva_worker}
webhook.worker.db-password=${DB_WORKER_PASSWORD:arthadhruva_worker}
webhook.worker.poll-ms=${WEBHOOK_POLL_MS:2000}
webhook.max-attempts=${WEBHOOK_MAX_ATTEMPTS:6}
# Subscription URLs pointing at loopback/private addresses are refused (SSRF): a tenant admin must
# not be able to make the server call internal services. Enable only for local testing.
webhook.allow-private-targets=${WEBHOOK_ALLOW_PRIVATE_TARGETS:false}

# Distributed rate limits (Redis token buckets, see ratelimit.RedisRateLimiter). An authenticated
# request draws from its organization's bucket, sized by the subscription plan, and from the caller's
# own bucket inside it (caller-share of the organization's allowance); an unauthenticated one from a
# bucket per client address. Heavy endpoints cost more than one token (RateLimitFilter.cost).
ratelimit.anonymous.capacity=${RATELIMIT_ANON_CAPACITY:20}
ratelimit.anonymous.per-second=${RATELIMIT_ANON_PER_SECOND:5}
ratelimit.caller-share=${RATELIMIT_CALLER_SHARE:0.5}

# Risk engine. Projections and simulations run on their own bounded pool so they cannot starve
# request threads: threads=0 means one fewer than the available cores, capped at max-threads.
risk.compute.threads=${RISK_COMPUTE_THREADS:0}
risk.compute.max-threads=${RISK_COMPUTE_MAX_THREADS:4}
# Portfolio runs in progress at once, and how many more may wait; beyond that a request gets 503.
risk.runs.concurrent=${RISK_RUNS_CONCURRENT:2}
risk.runs.queue=${RISK_RUNS_QUEUE:8}
# Larger portfolios are projected on a random sample of this size, with the sampling error reported.
risk.portfolio.max-loans=${RISK_PORTFOLIO_MAX_LOANS:5000}
risk.portfolio.snapshot-cron=${RISK_PORTFOLIO_SNAPSHOT_CRON:0 30 3 1 * *}
# Monte Carlo admission control: simulations at once, the loans x scenarios budget of one, and its deadline.
cvar.max-concurrent=${CVAR_MAX_CONCURRENT:2}
cvar.max-work=${CVAR_MAX_WORK:400000000}
cvar.timeout-seconds=${CVAR_TIMEOUT_SECONDS:30}
# Survival / ECL assumptions (see MODELS.md). The haircut is the share of a property's value lost in a
# forced sale; the SICR thresholds move a loan to IFRS 9 stage 2.
survival.overlay-enabled=${SURVIVAL_OVERLAY_ENABLED:true}
survival.lgd.liquidation-haircut=${SURVIVAL_LIQUIDATION_HAIRCUT:0.15}
survival.sicr.relative-threshold=${SURVIVAL_SICR_RELATIVE:2.0}
survival.sicr.absolute-threshold=${SURVIVAL_SICR_ABSOLUTE:0.005}

# Scheduled jobs (cron, UTC). Each runs once per period across all replicas (scheduling.DistributedLock).
idempotency.purge-cron=${IDEMPOTENCY_PURGE_CRON:0 17 * * * *}
insights.refresh-cron=${INSIGHTS_REFRESH_CRON:0 0 2 * * *}
notifications.digest-cron=${NOTIFICATIONS_DIGEST_CRON:0 0 8 * * *}

# Optional platform operator account (organization "platform"); created only when set.
platform.admin-password=${PLATFORM_ADMIN_PASSWORD:}
# Stripe is used only when a secret key is set; price ids per plan code.
billing.stripe.secret-key=${STRIPE_SECRET_KEY:}
billing.stripe.price.starter=${STRIPE_PRICE_STARTER:}
billing.stripe.price.pro=${STRIPE_PRICE_PRO:}

# Transactional email: set SPRING_MAIL_HOST (and _PORT/_USERNAME/_PASSWORD); unset (default) means emails are logged, not sent.
email.from=${EMAIL_FROM:no-reply@arthadhruva.local}

# Tenant from the request host: acme.<base-domain> means organization "acme". Empty disables it.
app.base-domain=${APP_BASE_DOMAIN:}
# Deprecation switch for the older orgSlug login field (see TenantSubdomainResolver).
auth.org-slug-login-enabled=${AUTH_ORG_SLUG_LOGIN_ENABLED:true}

# Connection pool and request concurrency, sized deliberately rather than left at defaults.
# Little's law: connections busy = requests/sec x avg DB time per request. At 200 req/s and ~20 ms of
# DB time that is ~4 busy connections, so 10 leaves headroom without letting N replicas x pool size
# approach Postgres' max_connections (100). Tomcat's thread cap is kept near that scale so overload
# queues briefly (accept-count) and then fails fast, instead of piling up hundreds of threads all
# waiting on a 10-connection pool.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.leak-detection-threshold=20000
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:60}
server.tomcat.accept-count=100
# On shutdown (a deploy), stop accepting requests and let those in flight finish, up to the timeout.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Compress JSON responses when a client talks to the app directly (behind nginx, nginx does it).
server.compression.enabled=true
server.compression.min-response-size=2048

# Latency histograms per endpoint (needed for p95 in Grafana; costs a few KB of memory per endpoint).
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Public base URL of this API (the OIDC redirect_uri is <this>/v1/sso/callback). Set to the real external URL.
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}
