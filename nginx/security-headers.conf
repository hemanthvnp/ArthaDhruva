# Included in every location that sets its own add_header: nginx does NOT inherit server-level
# add_header into a location that declares any add_header of its own, so this is repeated by
# include rather than set once at server level.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Names the answering replica when the stack runs with EXPOSE_UPSTREAM=1; otherwise the value is
# empty and nginx sends no header (see the map in default.conf.template).
add_header X-Upstream $upstream_debug always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
