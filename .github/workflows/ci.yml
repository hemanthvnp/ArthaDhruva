name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/risk-engine/pom.xml

      - name: Run backend tests
        working-directory: backend/risk-engine
        run: |
          chmod +x mvnw
          ./mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Type-check and build
        working-directory: frontend
        run: npm run build

      - name: Enforce initial-bundle budget
        working-directory: frontend
        run: npm run check:bundle

  deployment-files:
    # The deployment files are code too. A compose file that does not parse, an alert rule that cannot
    # fire or a script with a syntax error is found here, not on the server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compose files parse in every layout
        run: |
          docker compose --profile app --profile edge --profile observability --profile notebooks --profile pipeline config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
          SITE_ADDRESS=example.test docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.deploy.yml \
            --profile app --profile edge config -q

      - name: Alert rules pass their unit tests
        run: |
          docker run --rm -v "$PWD/observability:/w:ro" --entrypoint promtool prom/prometheus:v2.55.1 check config /w/prometheus.yml
          docker run --rm -v "$PWD/observability:/w:ro" --entrypoint promtool prom/prometheus:v2.55.1 test rules /w/alerts.test.yml

      - name: Shell scripts are sound
        run: docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.11.0 deploy/*.sh deploy/azure/*.sh scripts/*.sh

      - name: The wake function passes its unit tests
        run: node --test deploy/azure/wake.test.js

  loadtest:
    # Performance gate: boots the real containerised stack and fails the build if p95 latency or the
    # error rate on the key endpoints regress past the thresholds in loadtest/smoke.js.
    runs-on: ubuntu-latest
    needs: backend
    env:
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-1234
      TOTP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ADMIN_PASSWORD: Ci-Admin-Passw0rd!2026
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        run: docker compose --profile app up -d --build postgres redis neo4j backend

      - name: Wait for the backend to be healthy
        run: |
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q backend)")" = healthy ] && exit 0
            sleep 5
          done
          docker compose logs backend | tail -50
          exit 1

      - name: Mint a session token for the bootstrap admin
        run: |
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          H=$(printf '{"alg":"HS256"}' | b64)
          ORG=$(docker compose exec -T postgres psql -U arthadhruva -d arthadhruva -Atc "select id from organization where slug='legacy'")
          # The test drives 40 requests a second through one account. On the default plan one caller is
          # allowed 25 a second, so the rate limiter would refuse a third of them: that is the limiter
          # working, not a regression to gate on. The largest plan leaves room for the load.
          docker compose exec -T postgres psql -U arthadhruva -d arthadhruva -c "update organization set plan_id = (select id from plan where code = 'PRO') where slug = 'legacy'"
          # A session token carries the account's session version (0 for a fresh account) and when the user
          # authenticated; the API refuses one without them.
          P=$(printf '{"sub":"admin","role":"ADMIN","org":%s,"sv":0,"auth_time":%s,"iat":%s,"exp":%s}' "$ORG" "$now" "$now" "$((now+3600))" | b64)
          S=$(printf '%s.%s' "$H" "$P" | openssl dgst -sha256 -hmac "$JWT_SECRET" -binary | b64)
          echo "TOKEN=$H.$P.$S" >> "$GITHUB_ENV"

      - name: Run k6
        run: |
          docker run --rm --network "$(docker network ls --format '{{.Name}}' | grep _edge$)" \
            -v "$PWD/loadtest:/work" -e TOKEN="$TOKEN" -e BASE=http://backend:8080/v1 -e RATE=40 -e DURATION=30s \
            grafana/k6 run /work/smoke.js
