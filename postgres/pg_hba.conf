# Only TLS connections from the network are accepted (no plain `host` line at all), and every
# one must authenticate with SCRAM. `local` is the in-container unix socket (healthcheck/admin);
# the container's network is internal, so it is not reachable from outside anyway.
local   all   all                    trust
# pg_basebackup (deploy/basebackup.sh) as the owner, over the same in-container socket.
local   replication   arthadhruva        trust
hostssl all   all   0.0.0.0/0        scram-sha-256
hostssl all   all   ::/0             scram-sha-256
