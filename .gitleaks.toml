# Secret scanning (the Security workflow). gitleaks' own rules, plus the findings that were looked at
# and are not secrets. Each exception matches one specific line, so nothing else is waved through.
[extend]
useDefault = true

[[allowlists]]
description = "The alphabet random bootstrap passwords are drawn from, not a password (AdminBootstrap)."
regexTarget = "line"
regexes = ['''PASSWORD_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789"''']

[[allowlists]]
description = "Local-development Neo4j default in an early commit. Deployments read the password from a Docker secret and refuse this default."
regexTarget = "line"
regexes = ['''NEO4J_AUTH: neo4j/arthadhruva$''']

[[allowlists]]
description = "A made-up placeholder password in a frontend unit test, in commit 2d15a7e (client.test.ts). Not a credential; the line now uses neutral values, but the commit stays in history."
regexTarget = "line"
regexes = ['''activateAccount\('invite-token', 'a-Strong-Passw0rd'\);''']
