server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Discovers this compose project's running containers through the Docker API and ships their
  # stdout to Loki -- the app's structured JSON console lines (logback-spring.xml) arrive
  # already-parseable, no per-service scrape config needed as new services are added.
  #
  # The API is reached through docker-socket-proxy, which only answers read-only questions about
  # containers and networks (see docker-compose.yml). The Docker daemon applies the project filter,
  # so containers of unrelated projects on the same machine are never listed at all. The project name
  # comes from the environment (-config.expand-env), so the filter holds whatever the checkout
  # directory is called.
  - job_name: docker
    docker_sd_configs:
      - host: tcp://docker-socket-proxy:2375
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=${COMPOSE_PROJECT_NAME}"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
