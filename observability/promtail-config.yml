server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Discovers this compose project's running containers via the Docker socket and ships their
  # stdout to Loki -- the app's structured JSON console lines (logback-spring.xml) arrive
  # already-parseable, no per-service scrape config needed as new services are added. Filtered to
  # this project's own containers (by the compose-project label Docker sets automatically) since
  # the same Docker daemon on a dev machine may be running unrelated projects too.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        regex: 'arthadhruva.*'
        action: keep
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
