global:
  scrape_interval: 10s

scrape_configs:
  - job_name: risk-engine
    metrics_path: /actuator/prometheus
    # DNS service discovery: `backend` resolves to every replica's address, so scaling the backend
    # (docker compose up --scale backend=N) is picked up automatically, one target per replica.
    dns_sd_configs:
      - names: ["backend"]
        type: A
        port: 8080
        refresh_interval: 10s
