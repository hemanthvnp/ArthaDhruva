# Config for the litellm service in docker-compose.yml -- maps the one logical model name the
# Java backend calls (litellm.model in application.properties, default "assistant-model") to a
# real provider. Swapping providers/models later is a one-line change here, not a Java code
# change -- that's the entire reason the backend talks to LiteLLM instead of a provider SDK
# directly.
#
# On Groq's free tier (no card required): console.groq.com -> API Keys -> GROQ_API_KEY in .env.
model_list:
  - model_name: assistant-model
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
